<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thực đơn — Cà Phê Gác Nhỏ</title>
  <meta name="description" content="Thực đơn điện tử tại bàn của Cà Phê Gác Nhỏ — cà phê phin, trà trái cây, đá xay và bánh nướng mỗi ngày.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #F4EDE2;
      --bg-surface: #FFFDF9;
      --bg-surface-alt: #EFE6D8;
      --bg-header: #3B2418;
      --bg-header-chip: rgba(255, 248, 238, 0.13);
      --text-header: #FAF4EB;
      --text-header-sub: #DFCBB8;

      --text-primary: #2B1B12;
      --text-secondary: #685041;
      --text-muted: #8C7565;

      --accent: #8B4A2B;
      --accent-hover: #70391F;
      --accent-soft: #F3E3D3;
      --accent-contrast: #FFFDF9;

      --border: #E4D6C4;
      --border-strong: #D2BFA7;

      --badge-hot-bg: #FDE8D2;
      --badge-hot-text: #9A3412;
      --badge-new-bg: #DCF2E4;
      --badge-new-text: #1E6B43;
      --badge-sold-bg: #E6DFD6;
      --badge-sold-text: #6E6157;

      --demo-bg: #FEF3C7;
      --demo-border: #E5B94C;
      --demo-text: #78350F;

      --shadow-sm: 0 2px 6px rgba(43, 27, 18, 0.06);
      --shadow-md: 0 8px 24px rgba(43, 27, 18, 0.12);
      --shadow-bar: 0 10px 28px rgba(43, 27, 18, 0.24);
      --backdrop: rgba(24, 15, 10, 0.56);

      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-pill: 999px;

      --font-body: "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-display: "Playfair Display", Georgia, "Times New Roman", serif;
      --max-w: 560px;
      --gutter: 16px;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-page: #16100D;
        --bg-surface: #221914;
        --bg-surface-alt: #2E221B;
        --bg-header: #2A1D16;
        --bg-header-chip: rgba(255, 240, 224, 0.1);
        --text-header: #F6EDE2;
        --text-header-sub: #CBB6A3;

        --text-primary: #F5ECE2;
        --text-secondary: #C6B2A1;
        --text-muted: #968171;

        --accent: #D79460;
        --accent-hover: #E3A777;
        --accent-soft: #3A291E;
        --accent-contrast: #1C120D;

        --border: #382A21;
        --border-strong: #4F3C30;

        --badge-hot-bg: #4A2B18;
        --badge-hot-text: #FDBA74;
        --badge-new-bg: #183929;
        --badge-new-text: #6EE7B7;
        --badge-sold-bg: #332A24;
        --badge-sold-text: #A9998D;

        --demo-bg: #3A2C12;
        --demo-border: #8C6A23;
        --demo-text: #FDE68A;

        --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.28);
        --shadow-md: 0 10px 28px rgba(0, 0, 0, 0.45);
        --shadow-bar: 0 12px 32px rgba(0, 0, 0, 0.55);
        --backdrop: rgba(8, 5, 3, 0.72);
      }
    }

    :root[data-theme="dark"] {
      --bg-page: #16100D;
      --bg-surface: #221914;
      --bg-surface-alt: #2E221B;
      --bg-header: #2A1D16;
      --bg-header-chip: rgba(255, 240, 224, 0.1);
      --text-header: #F6EDE2;
      --text-header-sub: #CBB6A3;

      --text-primary: #F5ECE2;
      --text-secondary: #C6B2A1;
      --text-muted: #968171;

      --accent: #D79460;
      --accent-hover: #E3A777;
      --accent-soft: #3A291E;
      --accent-contrast: #1C120D;

      --border: #382A21;
      --border-strong: #4F3C30;

      --badge-hot-bg: #4A2B18;
      --badge-hot-text: #FDBA74;
      --badge-new-bg: #183929;
      --badge-new-text: #6EE7B7;
      --badge-sold-bg: #332A24;
      --badge-sold-text: #A9998D;

      --demo-bg: #3A2C12;
      --demo-border: #8C6A23;
      --demo-text: #FDE68A;

      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.28);
      --shadow-md: 0 10px 28px rgba(0, 0, 0, 0.45);
      --shadow-bar: 0 12px 32px rgba(0, 0, 0, 0.55);
      --backdrop: rgba(8, 5, 3, 0.72);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-primary);
      background-color: var(--bg-page);
      overflow-x: clip;
      min-height: 100dvh;
    }

    button, input, textarea {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: var(--max-w);
      margin: 0 auto;
      padding-bottom: 104px;
    }

    /* Header */
    .shop-header-wrap {
      padding: 14px var(--gutter) 10px;
    }

    .shop-header {
      background: var(--bg-header);
      color: var(--text-header);
      border-radius: var(--radius-lg);
      padding: 18px 18px 16px;
      box-shadow: var(--shadow-md);
      position: relative;
      overflow: hidden;
    }

    .shop-header::after {
      content: "";
      position: absolute;
      width: 170px;
      height: 170px;
      right: -52px;
      top: -58px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(215, 148, 96, 0.22) 0%, rgba(215, 148, 96, 0) 70%);
      pointer-events: none;
    }

    .header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      position: relative;
      z-index: 1;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      background: var(--bg-header-chip);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid rgba(255, 244, 230, 0.14);
    }

    .brand-text {
      min-width: 0;
    }

    .shop-name {
      margin: 0;
      font-family: var(--font-display);
      font-size: 23px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.01em;
    }

    .shop-sub {
      margin: 3px 0 0;
      font-size: 12.5px;
      color: var(--text-header-sub);
    }

    .theme-btn {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(255, 244, 230, 0.18);
      background: var(--bg-header-chip);
      color: var(--text-header);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s ease, transform 0.15s ease;
    }

    .theme-btn:hover {
      background: rgba(255, 248, 238, 0.22);
    }

    .theme-btn:active {
      transform: scale(0.94);
    }

    .shop-meta {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      position: relative;
      z-index: 1;
    }

    .meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: var(--radius-pill);
      background: var(--bg-header-chip);
      font-size: 12px;
      color: var(--text-header);
      white-space: nowrap;
    }

    /* Sticky Search + Categories */
    .sticky-controls {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--bg-page);
      border-bottom: 1px solid var(--border);
      padding: 10px var(--gutter) 10px;
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      color: var(--text-muted);
      pointer-events: none;
      display: flex;
    }

    .search-input {
      width: 100%;
      height: 40px;
      padding: 0 38px 0 38px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: var(--bg-surface);
      font-size: 14px;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .search-input::-webkit-search-cancel-button {
      -webkit-appearance: none;
      appearance: none;
    }

    .search-clear {
      position: absolute;
      right: 8px;
      width: 26px;
      height: 26px;
      border: none;
      border-radius: 50%;
      background: var(--bg-surface-alt);
      color: var(--text-secondary);
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      line-height: 1;
    }

    .search-clear.is-visible {
      display: inline-flex;
    }

    .cat-nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
    }

    .cat-nav::-webkit-scrollbar {
      display: none;
    }

    .cat-pill {
      flex: 0 0 auto;
      padding: 7px 14px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      transition: background-color 0.18s ease, color 0.18s ease, border-color 0.18s ease;
    }

    .cat-pill:hover {
      border-color: var(--border-strong);
      color: var(--text-primary);
    }

    .cat-pill.is-active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-contrast);
    }

    /* Menu Sections */
    .menu-main {
      padding: 10px var(--gutter) 0;
    }

    .menu-section {
      margin-top: 18px;
      scroll-margin-top: 112px;
    }

    .menu-section:first-child {
      margin-top: 8px;
    }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .section-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .section-count {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Item Card */
    .item-card {
      display: flex;
      gap: 12px;
      padding: 12px;
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      transition: border-color 0.18s ease;
    }

    .item-card.is-in-cart {
      border-color: var(--accent);
    }

    .item-card.is-soldout {
      opacity: 0.62;
    }

    .item-card.is-soldout .item-art {
      filter: grayscale(0.55);
    }

    .item-art {
      width: 76px;
      height: 76px;
      border-radius: 12px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(43, 27, 18, 0.06);
      overflow: hidden;
    }

    .item-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    .item-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 6px;
    }

    .item-name {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.3;
      color: var(--text-primary);
    }

    .badge {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    .badge-hot {
      background: var(--badge-hot-bg);
      color: var(--badge-hot-text);
    }

    .badge-new {
      background: var(--badge-new-bg);
      color: var(--badge-new-text);
    }

    .badge-sold {
      background: var(--badge-sold-bg);
      color: var(--badge-sold-text);
    }

    .item-desc {
      margin: 3px 0 0;
      font-size: 12.5px;
      line-height: 1.42;
      color: var(--text-secondary);
    }

    .item-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 2px;
    }

    .price-size-group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      min-width: 0;
    }

    .item-price {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
    }

    .size-switch {
      display: inline-flex;
      background: var(--bg-surface-alt);
      border-radius: var(--radius-pill);
      padding: 2px;
      border: 1px solid var(--border);
    }

    .size-btn {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 11.5px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: var(--radius-pill);
      line-height: 1.25;
      white-space: nowrap;
      transition: background-color 0.16s ease, color 0.16s ease;
    }

    .size-btn.is-selected {
      background: var(--bg-surface);
      color: var(--text-primary);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
    }

    .stepper {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--bg-surface-alt);
      border-radius: var(--radius-pill);
      padding: 2px;
      border: 1px solid var(--border);
    }

    .stepper.has-qty {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .step-btn {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 50%;
      background: var(--bg-surface);
      color: var(--text-primary);
      font-size: 17px;
      font-weight: 600;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease, transform 0.12s ease;
    }

    .step-btn.step-plus {
      background: var(--accent);
      color: var(--accent-contrast);
    }

    .step-btn.step-plus:hover {
      background: var(--accent-hover);
    }

    .step-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .step-btn:not(:disabled):active {
      transform: scale(0.92);
    }

    .step-qty {
      min-width: 22px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .soldout-note {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .other-size-hint {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: -2px;
    }

    /* Empty search */
    .empty-state {
      text-align: center;
      padding: 36px 20px;
      background: var(--bg-surface);
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-md);
      margin-top: 16px;
    }

    .empty-state p {
      margin: 0 0 12px;
      color: var(--text-secondary);
      font-size: 14px;
    }

    .empty-reset {
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
    }

    /* Footer */
    .shop-footer {
      margin-top: 28px;
      padding: 16px var(--gutter) 8px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
    }

    /* Sticky Bottom Cart Bar */
    .cart-bar-wrap {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 40;
      padding: 10px var(--gutter) calc(12px + env(safe-area-inset-bottom, 0px));
      pointer-events: none;
    }

    .cart-bar-inner {
      max-width: calc(var(--max-w) - 32px);
      margin: 0 auto;
      pointer-events: auto;
    }

    .cart-bar {
      width: 100%;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      color: var(--text-primary);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--shadow-bar);
      transition: background-color 0.2s ease, color 0.2s ease, transform 0.15s ease;
    }

    .cart-bar.has-items {
      background: var(--bg-header);
      border-color: transparent;
      color: var(--text-header);
    }

    .cart-bar:active {
      transform: scale(0.99);
    }

    .cart-bar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .cart-count-badge {
      min-width: 28px;
      height: 28px;
      padding: 0 8px;
      border-radius: var(--radius-pill);
      background: var(--bg-surface-alt);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .cart-bar.has-items .cart-count-badge {
      background: var(--accent);
      color: var(--accent-contrast);
    }

    .cart-bar-text {
      text-align: left;
      min-width: 0;
    }

    .cart-bar-label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.25;
    }

    .cart-bar.has-items .cart-bar-label {
      color: var(--text-header-sub);
    }

    .cart-bar-total {
      display: block;
      font-size: 15.5px;
      font-weight: 700;
      line-height: 1.25;
    }

    .cart-bar-cta {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      padding: 7px 12px;
      border-radius: var(--radius-pill);
      background: var(--bg-surface-alt);
      color: var(--text-secondary);
    }

    .cart-bar.has-items .cart-bar-cta {
      background: rgba(255, 248, 238, 0.16);
      color: var(--text-header);
    }

    /* Order Summary Bottom Sheet */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: var(--backdrop);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.22s ease, visibility 0.22s ease;
    }

    .sheet-backdrop.is-open {
      opacity: 1;
      visibility: visible;
    }

    .sheet {
      width: 100%;
      max-width: var(--max-w);
      max-height: 88dvh;
      background: var(--bg-surface);
      border-radius: 22px 22px 0 0;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transform: translateY(28px);
      transition: transform 0.24s ease;
      overflow: hidden;
    }

    .sheet-backdrop.is-open .sheet {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 40px;
      height: 4px;
      border-radius: 99px;
      background: var(--border-strong);
      margin: 10px auto 2px;
      flex-shrink: 0;
    }

    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 18px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sheet-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
    }

    .sheet-close {
      width: 34px;
      height: 34px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--bg-surface-alt);
      color: var(--text-primary);
      font-size: 20px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .sheet-body {
      padding: 14px 18px 18px;
      overflow-y: auto;
      flex: 1;
    }

    .cart-empty {
      text-align: center;
      padding: 24px 12px;
      color: var(--text-secondary);
      font-size: 14px;
    }

    .cart-items {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

      // Helpers
      function formatVnd(amount) {
        return String(amount).replace(/\B(?=(\d{3})+(?!\d))/g, ".") + "đ";
      }

      function normalizeVi(str) {
        return String(str)
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/đ/g, "d")
          .trim();
      }

      function getItemById(id) {
        for (var i = 0; i < MENU_ITEMS.length; i++) {
          if (MENU_ITEMS[i].id === id) return MENU_ITEMS[i];
        }
        return null;
      }

      function getUnitPrice(item, size) {
        if (item.hasSize && size === "L") {
          return item.price + SIZE_L_SURCHARGE;
        }
        return item.price;
      }

      function getCartKey(itemId, size) {
        return itemId + "::" + size;
      }

      function getQty(itemId, size) {
        return cart[getCartKey(itemId, size)] || 0;
      }

      function updateQty(itemId, size, delta) {
        var item = getItemById(itemId);
        if (!item || item.soldOut) return;
        var key = getCartKey(itemId, size);
        var next = (cart[key] || 0) + delta;
        if (next <= 0) {
          delete cart[key];
        } else {
          cart[key] = next;
        }
        hideDemoAlert();
        renderMenu();
        updateCartUI();
        if (sheetBackdropEl.classList.contains("is-open")) {
          renderSheetCart();
        }
      }

      function getCartSummary() {
        var entries = [];
        var totalQty = 0;
        var totalPrice = 0;

        Object.keys(cart).forEach(function (key) {
          var qty = cart[key];
          if (!qty || qty <= 0) return;
          var parts = key.split("::");
          var item = getItemById(parts[0]);
          var size = parts[1];
          if (!item) return;
          var unitPrice = getUnitPrice(item, size);
          var lineTotal = unitPrice * qty;
          totalQty += qty;
          totalPrice += lineTotal;
          entries.push({
            key: key,
            item: item,
            size: size,
            qty: qty,
            unitPrice: unitPrice,
            lineTotal: lineTotal
          });
        });

        return {
          entries: entries,
          totalQty: totalQty,
          totalPrice: totalPrice
        };
      }

      function renderCatNav() {
        catNavEl.innerHTML = "";
        CATEGORIES.forEach(function (cat) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "cat-pill" + (cat.id === activeCategoryId ? " is-active" : "");
          btn.dataset.catId = cat.id;
          btn.textContent = cat.name;
          btn.addEventListener("click", function () {
            if (searchQuery) {
              searchQuery = "";
              searchInputEl.value = "";
              searchClearEl.classList.remove("is-visible");
              renderMenu();
            }
            activeCategoryId = cat.id;
            updateActiveCatPill();
            var target = document.getElementById("sec-" + cat.id);
            if (target) {
              target.scrollIntoView({ behavior: "smooth", block: "start" });
            }
          });
          catNavEl.appendChild(btn);
        });
      }

      function updateActiveCatPill() {
        var pills = catNavEl.querySelectorAll(".cat-pill");
        pills.forEach(function (pill) {
          var isAct = pill.dataset.catId === activeCategoryId;
          pill.classList.toggle("is-active", isAct);
          if (isAct) {
            pill.setAttribute("aria-current", "true");
            pill.scrollIntoView({ behavior: "smooth", inline: "nearest", block: "nearest" });
          } else {
            pill.removeAttribute("aria-current");
          }
        });
      }

      function renderMenu() {
        var normQuery = normalizeVi(searchQuery);
        menuContainerEl.innerHTML = "";
        var totalMatched = 0;

        CATEGORIES.forEach(function (cat) {
          var items = MENU_ITEMS.filter(function (item) {
            if (item.category !== cat.id) return false;
            if (!normQuery) return true;
            return normalizeVi(item.name).indexOf(normQuery) !== -1;
          });

          if (items.length === 0) return;
          totalMatched += items.length;

          var section = document.createElement("section");
          section.className = "menu-section";
          section.id = "sec-" + cat.id;
          section.dataset.catId = cat.id;

          var head = document.createElement("div");
          head.className = "section-head";
          var title = document.createElement("h2");
          title.className = "section-title";
          title.textContent = cat.name;
          var count = document.createElement("span");
          count.className = "section-count";
          count.textContent = items.length + " món";
          head.appendChild(title);
          head.appendChild(count);
          section.appendChild(head);

          var list = document.createElement("div");
          list.className = "item-list";

          items.forEach(function (item) {
            var currentSize = selectedSizeByItem[item.id] || (item.hasSize ? "M" : "STD");
            var currentQty = getQty(item.id, currentSize);
            var otherSize = item.hasSize ? (currentSize === "M" ? "L" : "M") : null;
            var otherQty = otherSize ? getQty(item.id, otherSize) : 0;
            var anyInCart = currentQty > 0 || otherQty > 0;

            var card = document.createElement("article");
            card.className = "item-card" + (item.soldOut ? " is-soldout" : "") + (anyInCart ? " is-in-cart" : "");

            // Illustration
            var artBox = document.createElement("div");
            artBox.className = "item-art";
            artBox.style.backgroundColor = item.art.bg;
            artBox.innerHTML = buildArtSvg(item.art);
            card.appendChild(artBox);

            // Body
            var body = document.createElement("div");
            body.className = "item-body";

            var topWrap = document.createElement("div");
            var topRow = document.createElement("div");
            topRow.className = "item-top";

            var nameEl = document.createElement("h3");
            nameEl.className = "item-name";
            nameEl.textContent = item.name;
            topRow.appendChild(nameEl);

            if (item.soldOut) {
              var soldBadge = document.createElement("span");
              soldBadge.className = "badge badge-sold";
              soldBadge.textContent = "Tạm hết";
              topRow.appendChild(soldBadge);
            } else if (item.badge === "hot") {
              var hotBadge = document.createElement("span");
              hotBadge.className = "badge badge-hot";
              hotBadge.textContent = "Bán chạy";
              topRow.appendChild(hotBadge);
            } else if (item.badge === "new") {
              var newBadge = document.createElement("span");
              newBadge.className = "badge badge-new";
              newBadge.textContent = "Mới";
              topRow.appendChild(newBadge);
            }

            topWrap.appendChild(topRow);

            var descEl = document.createElement("p");
            descEl.className = "item-desc";
            descEl.textContent = item.desc;
            topWrap.appendChild(descEl);
            body.appendChild(topWrap);

            // Bottom Controls
            var controls = document.createElement("div");
            controls.className = "item-controls";

            var leftGroup = document.createElement("div");
            leftGroup.className = "price-size-group";

            var priceEl = document.createElement("span");
            priceEl.className = "item-price";
            priceEl.textContent = formatVnd(getUnitPrice(item, currentSize));
            leftGroup.appendChild(priceEl);

            if (item.hasSize && !item.soldOut) {
              var sizeSwitch = document.createElement("div");
              sizeSwitch.className = "size-switch";
              sizeSwitch.setAttribute("role", "group");
              sizeSwitch.setAttribute("aria-label", "Chọn size cho " + item.name);

              var btnM = document.createElement("button");
              btnM.type = "button";
              btnM.className = "size-btn" + (currentSize === "M" ? " is-selected" : "");
              btnM.textContent = "M";
              btnM.setAttribute("aria-pressed", currentSize === "M" ? "true" : "false");
              btnM.addEventListener("click", function () {
                selectedSizeByItem[item.id] = "M";
                renderMenu();
              });

              var btnL = document.createElement("button");
              btnL.type = "button";
              btnL.className = "size-btn" + (currentSize === "L" ? " is-selected" : "");
              btnL.textContent = "L +5k";
              btnL.title = "Size L (+5.000đ)";
              btnL.setAttribute("aria-pressed", currentSize === "L" ? "true" : "false");
              btnL.addEventListener("click", function () {
                selectedSizeByItem[item.id] = "L";
                renderMenu();
              });

              sizeSwitch.appendChild(btnM);
              sizeSwitch.appendChild(btnL);
              leftGroup.appendChild(sizeSwitch);
            }

            controls.appendChild(leftGroup);

            if (item.soldOut) {
              var soldNote = document.createElement("span");
              soldNote.className = "soldout-note";
              soldNote.textContent = "Tạm hết";
              controls.appendChild(soldNote);
            } else {
              var stepper = document.createElement("div");
              stepper.className = "stepper" + (currentQty > 0 ? " has-qty" : "");

              var minusBtn = document.createElement("button");
              minusBtn.type = "button";
              minusBtn.className = "step-btn";
              minusBtn.textContent = "−";
              minusBtn.disabled = currentQty === 0;
              minusBtn.setAttribute("aria-label", "Giảm số lượng " + item.name);
              minusBtn.addEventListener("click", function () {
                updateQty(item.id, currentSize, -1);
              });

              var qtySpan = document.createElement("span");
              qtySpan.className = "step-qty";
              qtySpan.textContent = String(currentQty);

              var plusBtn = document.createElement("button");
              plusBtn.type = "button";
              plusBtn.className = "step-btn step-plus";
              plusBtn.textContent = "+";
              plusBtn.setAttribute("aria-label", "Thêm " + item.name + (item.hasSize ? " size " + currentSize : ""));
              plusBtn.addEventListener("click", function () {
                updateQty(item.id, currentSize, 1);
              });

              stepper.appendChild(minusBtn);
              stepper.appendChild(qtySpan);
              stepper.appendChild(plusBtn);
              controls.appendChild(stepper);
            }

            body.appendChild(controls);

            if (!item.soldOut && otherQty > 0) {
              var hint = document.createElement("div");
              hint.className = "other-size-hint";
              hint.textContent = "Trong giỏ đã có size " + otherSize + " × " + otherQty;
              body.appendChild(hint);
            }

            card.appendChild(body);
            list.appendChild(card);
          });

          section.appendChild(list);
          menuContainerEl.appendChild(section);
        });

        if (totalMatched === 0) {
          var empty = document.createElement("div");
          empty.className = "empty-state";
          var msg = document.createElement("p");
          msg.textContent = 'Không tìm thấy món nào khớp với "' + searchQuery + '".';
          var resetBtn = document.createElement("button");
          resetBtn.type = "button";
          resetBtn.className = "empty-reset";
          resetBtn.textContent = "Xem lại toàn bộ thực đơn";
          resetBtn.addEventListener("click", function () {
            searchQuery = "";
            searchInputEl.value = "";
            searchClearEl.classList.remove("is-visible");
            renderMenu();
          });
          empty.appendChild(msg);
          empty.appendChild(resetBtn);
          menuContainerEl.appendChild(empty);
        }
      }

      function updateCartUI() {
        var summary = getCartSummary();
        cartBarCountEl.textContent = String(summary.totalQty);
        cartBarTotalEl.textContent = formatVnd(summary.totalPrice);
        cartBarBtnEl.classList.toggle("has-items", summary.totalQty > 0);

        if (summary.totalQty > 0) {
          cartBarLabelEl.textContent = summary.totalQty + " món đã chọn";
          cartBarCtaEl.textContent = "Xem đơn ›";
        } else {
          cartBarLabelEl.textContent = "Chưa chọn món";
          cartBarCtaEl.textContent = "Xem đơn";
        }

        sheetSummaryLabelEl.textContent = "Tổng cộng (" + summary.totalQty + " món)";
        sheetSummaryTotalEl.textContent = formatVnd(summary.totalPrice);
        submitOrderBtnEl.disabled = summary.totalQty === 0;
      }

      function renderSheetCart() {
        var summary = getCartSummary();
        sheetCartContentEl.innerHTML = "";

        if (summary.entries.length === 0) {
          var emptyDiv = document.createElement("div");
          emptyDiv.className = "cart-empty";
          emptyDiv.textContent = "Giỏ hàng đang trống. Bạn chọn món bằng nút + ở thực đơn nhé.";
          sheetCartContentEl.appendChild(emptyDiv);
          return;
        }

        var list = document.createElement("div");
        list.className = "cart-items";

        summary.entries.forEach(function (entry) {
          var row = document.createElement("div");
          row.className = "cart-row";

          var info = document.createElement("div");
          info.className = "cart-row-info";

          var name = document.createElement("div");
          name.className = "cart-row-name";
          name.textContent = entry.item.name;

          var meta = document.createElement("div");
          meta.className = "cart-row-meta";
          var sizeLabel = entry.item.hasSize ? "Size " + entry.size + " · " : "";
          meta.textContent = sizeLabel + formatVnd(entry.unitPrice);

          info.appendChild(name);
          info.appendChild(meta);

          var right = document.createElement("div");
          right.className = "cart-row-right";

          var subtotal = document.createElement("div");
          subtotal.className = "cart-row-subtotal";
          subtotal.textContent = formatVnd(entry.lineTotal);

          var stepper = document.createElement("div");
          stepper.className = "stepper has-qty";

          var minusBtn = document.createElement("button");
          minusBtn.type = "button";
          minusBtn.className = "step-btn";
          minusBtn.textContent = "−";
          minusBtn.setAttribute("aria-label", "Giảm " + entry.item.name);
          minusBtn.addEventListener("click", function () {
            updateQty(entry.item.id, entry.size, -1);
          });

          var qtySpan = document.createElement("span");
          qtySpan.className = "step-qty";
          qtySpan.textContent = String(entry.qty);

          var plusBtn = document.createElement("button");
          plusBtn.type = "button";
          plusBtn.className = "step-btn step-plus";
          plusBtn.textContent = "+";
          plusBtn.setAttribute("aria-label", "Tăng " + entry.item.name);
          plusBtn.addEventListener("click", function () {
            updateQty(entry.item.id, entry.size, 1);
          });

          stepper.appendChild(minusBtn);
          stepper.appendChild(qtySpan);
          stepper.appendChild(plusBtn);

          right.appendChild(subtotal);
          right.appendChild(stepper);

          row.appendChild(info);
          row.appendChild(right);
          list.appendChild(row);
        });

        sheetCartContentEl.appendChild(list);

        var clearWrap = document.createElement("div");
        clearWrap.className = "clear-cart-wrap";
        var clearBtn = document.createElement("button");
        clearBtn.type = "button";
        clearBtn.className = "clear-cart-btn";
        clearBtn.textContent = "Xóa tất cả món";
        clearBtn.addEventListener("click", function () {
          cart = {};
          hideDemoAlert();
          renderMenu();
          updateCartUI();
          renderSheetCart();
        });
        clearWrap.appendChild(clearBtn);
        sheetCartContentEl.appendChild(clearWrap);
      }

      function hideDemoAlert() {
        demoAlertEl.classList.remove("is-visible");
        demoAlertDetailEl.textContent = "";
      }

      function openSheet() {
        hideDemoAlert();
        renderSheetCart();
        updateCartUI();
        sheetBackdropEl.classList.add("is-open");
        sheetBackdropEl.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
        sheetCloseBtnEl.focus();
      }

      function closeSheet() {
        sheetBackdropEl.classList.remove("is-open");
        sheetBackdropEl.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
        cartBarBtnEl.focus();
      }

      // Events
      searchInputEl.addEventListener("input", function () {
        searchQuery = searchInputEl.value;
        searchClearEl.classList.toggle("is-visible", searchQuery.length > 0);
        renderMenu();
      });

      searchClearEl.addEventListener("click", function () {
        searchQuery = "";
        searchInputEl.value = "";
        searchClearEl.classList.remove("is-visible");
        renderMenu();
        searchInputEl.focus();
      });

      cartBarBtnEl.addEventListener("click", openSheet);
      sheetCloseBtnEl.addEventListener("click", closeSheet);

      sheetBackdropEl.addEventListener("click", function (e) {
        if (e.target === sheetBackdropEl) {
          closeSheet();
        }
      });

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && sheetBackdropEl.classList.contains("is-open")) {
          closeSheet();
        }
      });

      submitOrderBtnEl.addEventListener("click", function () {
        var summary = getCartSummary();
        if (summary.totalQty === 0) return;
        var tableVal = tableNumberEl.value.trim();
        var noteVal = orderNoteEl.value.trim();
        var parts = [summary.totalQty + " món · " + formatVnd(summary.totalPrice)];
        if (tableVal) parts.push("Bàn: " + tableVal);
        if (noteVal) parts.push("Ghi chú: " + noteVal);
        demoAlertDetailEl.textContent = parts.join(" | ");
        demoAlertEl.classList.add("is-visible");
        demoAlertEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
      });

      // Scrollspy for active category pill
      var scrollTicking = false;
      window.addEventListener("scroll", function () {
        if (scrollTicking || searchQuery) return;
        scrollTicking = true;
        window.requestAnimationFrame(function () {
          var sections = menuContainerEl.querySelectorAll(".menu-section");
          var offset = 135;
          var current = activeCategoryId;
          sections.forEach(function (sec) {
            var rect = sec.getBoundingClientRect();
            if (rect.top <= offset) {
              current = sec.dataset.catId;
            }
          });
          if (current !== activeCategoryId) {
            activeCategoryId = current;
            updateActiveCatPill();
          }
          scrollTicking = false;
        });
      }, { passive: true });

      // Theme toggle (honors system dark mode initially, allows manual switch)
      function isDarkActive() {
        var attr = document.documentElement.getAttribute("data-theme");
        if (attr === "dark") return true;
        if (attr === "light") return false;
        return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      }

      function syncThemeIcon() {
        if (isDarkActive()) {
          themeIconEl.innerHTML =
            '<circle cx="12" cy="12" r="4.5"/>' +
            '<path d="M12 2.5v2.2M12 19.3v2.2M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/>';
        } else {
          themeIconEl.innerHTML =
            '<path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79Z"/>';
        }
      }

      themeToggleEl.addEventListener("click", function () {
        var next = isDarkActive() ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        syncThemeIcon();
      });

      if (window.matchMedia) {
        var mq = window.matchMedia("(prefers-color-scheme: dark)");
        if (mq.addEventListener) {
          mq.addEventListener("change", syncThemeIcon);
        }
      }

      // Init
      syncThemeIcon();
      renderCatNav();
      renderMenu();
      updateCartUI();
    })();
  </script>
</body>
</html>
